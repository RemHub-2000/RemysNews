<!doctype html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remy's News</title><meta name="description" content="Your daily reading: Sydney, Apple, Tesla, AI, technology and the world.">
<meta name="theme-color" content="#111b26"><meta name="color-scheme" content="dark"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111b26'/%3E%3Cpath d='M7 23V9h4l5 8 5-8h4v14h-4v-8l-5 7-5-7v8z' fill='%23f2b68c'/%3E%3C/svg%3E">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css"><script defer src="./app.js"></script>
</head>
<body>
<a class="skip" href="#stories">Skip to stories</a>
<div class="page">
<header>
<p class="eyebrow">FOR REMY</p>
<div class="edition"><label class="sr-only" for="edition">Choose an edition</label><select id="edition"></select></div>
<h1>Remy's News</h1>
<div class="dateline"><span id="date">Loading edition…</span><span><span id="checked"></span><span id="reading"></span></span></div>
</header>
<div id="dayparts" class="dayparts" role="tablist" aria-label="Editions for the selected day" hidden>
<button id="tab-morning" type="button" role="tab" aria-controls="edition-panel" aria-selected="true" tabindex="0">Morning</button>
<button id="tab-afternoon" type="button" role="tab" aria-controls="edition-panel" aria-selected="false" tabindex="-1">Afternoon</button>
</div>
<div id="edition-panel">
<nav id="categories" aria-label="News categories" hidden></nav>
<div class="reading-tools"><p id="count" role="status" aria-live="polite"></p><button id="expand" type="button" hidden>Show all details</button></div>
<main id="stories" aria-label="News stories" tabindex="-1"><p>Loading your briefing…</p></main>
<footer><p id="note"></p><p>ABC first · 9to5Mac first · One story, one summary</p></footer>
</div>
</div>
</body></html>
