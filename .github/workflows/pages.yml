name: Deploy Morning Brief to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'update-edition.mjs'
      - 'scripts/**'
      - 'test/**'
      - 'config/publishing.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the updater and publication checks
        run: node --test
      - name: Validate the archive and reader
        run: |
          node update-edition.mjs --validate
          node --check dist/app.js
          node --check dist/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for the Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --max-time 3 \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --get --data-urlencode "name=$PAGES_ARTIFACT_NAME" "$artifacts_url" |
                jq -e --arg name "$PAGES_ARTIFACT_NAME" \
                  '[.artifacts[] | select(.name == $name and .expired == false)] | length == 1' >/dev/null; then
              echo "Pages artifact is visible: $PAGES_ARTIFACT_NAME"
              exit 0
            fi
            if (( attempt < 10 )); then
              sleep 3
            fi
          done
          echo "::error::Expected one live Pages artifact named $PAGES_ARTIFACT_NAME after 10 checks"
          exit 1
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Verify the exact archive is live
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published.mjs "$PAGE_URL"
